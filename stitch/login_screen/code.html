            background: rgba(255, 255, 255, 0.4);

<body class="bg-surface font-body text-on-surface min-h-screen flex flex-col items-center justify-center p-4 overflow-x-hidden">
<!-- Top Navigation Anchor (Shared Component Execution) -->
<header class="w-full top-0 sticky bg-[#fff5ed] dark:bg-stone-950 flex items-center justify-between px-6 py-4 mx-auto z-50">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-2xl text-[#8c4a00] dark:text-[#fd8b00]" data-icon="wb_sunny">wb_sunny</span>
<h1 class="font-['Plus_Jakarta_Sans'] font-bold text-lg text-[#8c4a00] dark:text-[#fd8b00]">Solaris Chat</h1>
</div>
</header>
<main class="w-full max-w-md mt-8 relative">
<!-- Background decorative elements for "Kinetic Warmth" -->
<div class="absolute -top-24 -left-24 w-64 h-64 bg-primary-container/20 rounded-full blur-3xl"></div>
<div class="absolute -bottom-24 -right-24 w-64 h-64 bg-tertiary-container/20 rounded-full blur-3xl"></div>
<div class="relative z-10 glass-panel border border-outline-variant/15 p-8 md:p-10 rounded-xl shadow-[0_20px_50px_rgba(69,40,0,0.05)]">
<!-- Welcome Header -->
<div class="text-center mb-10">
<h2 class="font-headline font-extrabold text-4xl text-primary tracking-tight mb-3">Welcome Back</h2>
<p class="text-on-surface-variant font-medium leading-relaxed">
                    Log in to continue your radiant conversations
                </p>
</div>
<!-- Login Form -->
<form class="space-y-6" onsubmit="return false;">
<div class="space-y-4">
<!-- Email Field -->
<div class="group">
<label class="block text-sm font-semibold text-on-surface-variant mb-2 ml-4" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="mail">mail</span>
</div>
<input class="w-full bg-surface-container-highest border-none rounded-full py-4 pl-12 pr-4 text-on-surface focus:ring-2 focus:ring-primary-fixed transition-all placeholder-on-surface-variant/50" id="email" name="email" placeholder="name@example.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="group">
<div class="flex justify-between items-center mb-2 ml-4 mr-4">
<label class="text-sm font-semibold text-on-surface-variant" for="password">Password</label>
<a class="text-xs font-bold text-primary hover:text-primary-dim transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="lock">lock</span>
</div>
<input class="w-full bg-surface-container-highest border-none rounded-full py-4 pl-12 pr-12 text-on-surface focus:ring-2 focus:ring-primary-fixed transition-all placeholder-on-surface-variant/50" id="password" name="password" placeholder="••••••••" type="password"/>
<div class="absolute inset-y-0 right-0 pr-4 flex items-center">
<button class="text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center ml-4">
<input class="w-5 h-5 rounded border-outline-variant text-primary-fixed focus:ring-primary-fixed bg-surface-container-highest" id="remember" type="checkbox"/>
<label class="ml-3 text-sm font-medium text-on-surface-variant" for="remember">Stay signed in for 30 days</label>
</div>
<!-- Main Action Button -->
<button class="w-full bg-gradient-to-b from-primary-fixed to-[#ea8000] text-on-primary-container font-headline font-bold text-lg py-4 rounded-xl shadow-[0_8px_20px_rgba(253,139,0,0.25)] hover:shadow-[0_12px_24px_rgba(253,139,0,0.35)] active:scale-[0.98] transition-all duration-200" type="submit">
                    Sign In to Solaris
                </button>
<!-- Social Login Separator -->
<div class="relative py-4">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/20"></div>
</div>
<div class="relative flex justify-center text-xs uppercase tracking-widest font-bold">
<span class="bg-surface-container px-4 text-on-surface-variant/60">Or connect with</span>
</div>
</div>
<!-- Social Options -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-2 bg-surface-container-low hover:bg-surface-container-high transition-colors py-3 px-4 rounded-xl font-semibold text-on-surface-variant text-sm" type="button">
<img alt="" class="w-5 h-5" data-alt="Google colorful logo icon on white background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAF8M1q0tXSOynJG0omA-mz7j0kE4UM_Ux0TKFYWnJkzQS_SI3CijGopd2BTuh86AHEhxDeD04-jcVm2KrSs5pg1PAjcD4Ak980c88n7CkGPDXWZGqF-Qm9liCaxzgZ_OJ0o-wTfNjsKSdPgreakr0LqWpN4mUR5eB-PdhW5yH41R1PqLTJFLon3nKYEq-GIu04swudCAx0GvSOiQIurL1ZojTw5yvp28HVLmz_4M7qtpYM1oehEOcjDswC48PjInx1qjP2rwj188g"/>
                        Google
                    </button>
<button class="flex items-center justify-center gap-2 bg-surface-container-low hover:bg-surface-container-high transition-colors py-3 px-4 rounded-xl font-semibold text-on-surface-variant text-sm" type="button">
<span class="material-symbols-outlined text-lg" data-icon="phone_iphone">phone_iphone</span>
                        Apple
                    </button>
</div>
</form>
<!-- Sign Up Redirect -->
<div class="mt-10 text-center">
<p class="text-on-surface-variant font-medium">
                    New here? 
                    <a class="text-primary font-bold ml-1 hover:underline underline-offset-4 decoration-2 transition-all" href="#">Create an account</a>
</p>
</div>
</div>
<!-- Footer Visual -->
<div class="mt-12 flex justify-center items-center gap-8 opacity-40">
<div class="flex items-center gap-2 grayscale hover:grayscale-0 transition-all duration-500">
<span class="material-symbols-outlined text-lg" data-icon="security">security</span>
<span class="text-[10px] font-bold tracking-tighter uppercase">Encrypted</span>
</div>
<div class="flex items-center gap-2 grayscale hover:grayscale-0 transition-all duration-500">
<span class="material-symbols-outlined text-lg" data-icon="cloud_done">cloud_done</span>
<span class="text-[10px] font-bold tracking-tighter uppercase">Cloud Sync</span>
</div>
</div>
</main>
<!-- Bottom Decorative Image Container (Asymmetric Layout) -->
<div class="fixed -bottom-20 -left-10 w-64 h-64 md:w-96 md:h-96 opacity-10 pointer-events-none rotate-12">
<img class="w-full h-full object-cover rounded-full" data-alt="vibrant abstract background with warm orange and yellow fluid waves blending together smoothly" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCMiVSoiq-GEWbdDrMOt0EhAltbllWiO72yE_Dx8RejTBexeVE2fry8iLNNF64KYtyeYsTav1DaSHIfmhOS7gPgfysBNXiaoKqDVfHbKPFpqzNGGQzBBcJ6uIG2H_s0xm0M_-f8Va4M4n3qrSrEhC0qzuRdJvSw3qf2NDWGDWiQFKXRHi3EHw_liaHUFbiJuKmSFgEbljYkNzFfXbN1u1wYIjmvncA0PxtsT8zOn0GOzMZq72JfYnGAYVH7GDYg7HXwtwMyLNAAiYE"/>
